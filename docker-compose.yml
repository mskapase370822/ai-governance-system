version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: ai_governance_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai-governance
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_governance_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/ai-governance
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      # Persist ML model weights
      - ./backend/ml/models:/app/ml/models

volumes:
  mongo_data:
